<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特斯拉飛天車 (Tesla Flying Car)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Inter', sans-serif; touch-action: none; }
        #game-canvas { width: 100vw; height: 100vh; display: block; }
        
        /* 遊戲介面 UI */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .hud-box { background: rgba(255, 255, 255, 0.8); border-radius: 12px; padding: 10px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 2px solid #e5e7eb; pointer-events: auto;}
        
        /* 能量條 */
        #battery-container { width: 200px; height: 20px; background: #374151; border-radius: 10px; overflow: hidden; border: 2px solid #1f2937; margin-top: 5px; }
        #battery-bar { width: 100%; height: 100%; background: #10b981; transition: width 0.1s linear; }

        /* 開始與結束畫面 */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 50; }
        .overlay button { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; padding: 15px 40px; font-size: 1.5rem; font-weight: bold; border-radius: 9999px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5); transition: transform 0.2s, box-shadow 0.2s; }
        .overlay button:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.7); }
        .overlay button:active { transform: scale(0.95); }

        /* 手機虛擬操作按鈕 */
        #mobile-controls { position: absolute; bottom: 30px; left: 0; width: 100%; padding: 0 20px; box-sizing: border-box; display: flex; justify-content: space-between; pointer-events: none; z-index: 40; }
        .control-group { display: flex; gap: 15px; pointer-events: auto; }
        .btn-control { width: 65px; height: 65px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); border: 2px solid rgba(255, 255, 255, 0.9); display: flex; justify-content: center; align-items: center; font-size: 24px; color: #333; user-select: none; touch-action: none; cursor: pointer; backdrop-filter: blur(4px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: background 0.1s, transform 0.1s; }
        .btn-control:active { background: rgba(255, 255, 255, 0.9); transform: scale(0.95); }
        .btn-fly { width: 80px; height: 80px; background: rgba(59, 130, 246, 0.7); color: white; border-color: rgba(59, 130, 246, 0.9); font-size: 32px; margin-top: -15px;}
        .btn-fly:active { background: rgba(59, 130, 246, 1); }
    </style>
</head>
<body>

    <!-- 3D 遊戲畫布 -->
    <canvas id="game-canvas"></canvas>

    <!-- 遊戲進行中的 HUD -->
    <div id="ui-layer" class="p-6 flex justify-between items-start hidden">
        <div class="hud-box">
            <div class="text-gray-800 font-bold text-xl uppercase tracking-wider">Score</div>
            <div id="score-display" class="text-4xl font-extrabold text-blue-600">0</div>
        </div>
        <div class="hud-box flex flex-col items-end">
            <div class="text-gray-800 font-bold text-lg uppercase tracking-wider">Flight Energy</div>
            <div id="battery-container">
                <div id="battery-bar"></div>
            </div>
            <div id="status-text" class="text-sm font-bold text-gray-500 mt-1">Grounded</div>
        </div>
        
        <!-- 手機操作按鈕 (左側方向、右側起飛) -->
        <div id="mobile-controls">
            <div class="control-group">
                <div id="btn-left" class="btn-control">◀</div>
                <div id="btn-right" class="btn-control">▶</div>
            </div>
            <div class="control-group">
                <div id="btn-fly" class="btn-control btn-fly">✈️</div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <h1 class="text-6xl font-extrabold text-white mb-4 text-center drop-shadow-lg">
            特斯拉飛天車<br><span class="text-3xl text-blue-300">特仕版白晝狂飆</span>
        </h1>
        <div class="bg-white/90 p-6 rounded-xl mb-8 text-gray-800 font-semibold shadow-xl text-center max-w-md">
            <p class="mb-2">🚗 <span class="text-blue-600">左右方向鍵</span>：切換四個車道</p>
            <p class="mb-2">✈️ <span class="text-blue-600">按住空白鍵</span>：啟動飛行器 (消耗能量)</p>
            <p class="mb-2">🪙 收集黃色<span class="text-yellow-500 font-bold">金幣</span>加分</p>
            <p class="mb-2">🔋 收集綠色<span class="text-green-600 font-bold">電池</span>補充飛行能量</p>
            <p class="mt-4 text-sm text-gray-500">注意：撞到車子會原地打轉，請善用飛行閃避！</p>
        </div>
        <button id="start-btn">啟動引擎</button>
    </div>

    <script>
        // === 遊戲全域變數 ===
        let scene, camera, renderer;
        let playerCar;
        let gameActive = false;
        let score = 0;
        let batteryLevel = 100;
        const maxBattery = 100;
        
        // 音樂與音效
        let bgm, flySynth, coinSynth, crashSynth, batterySynth;
        let audioInitialized = false;

        // 車道設定 (4個車道)
        const LANES = [-4.5, -1.5, 1.5, 4.5];
        let currentLane = 1;
        let targetX = LANES[currentLane];

        // 飛行物理與控制
        let isFlying = false;
        let velocityY = 0;
        let gravity = -0.015;
        let thrust = 0.03;
        let groundLevel = 0;

        // 撞車打轉機制
        let isSpinning = false;
        let spinAngle = 0;
        let invincibleTime = 0;

        // 物件陣列
        const obstacles = [];
        const items = [];
        const roadLines = [];
        const trees = [];
        let speed = 0.8;

        // UI 元素
        const scoreDisplay = document.getElementById('score-display');
        const batteryBar = document.getElementById('battery-bar');
        const statusText = document.getElementById('status-text');
        const uiLayer = document.getElementById('ui-layer');
        const startScreen = document.getElementById('start-screen');

        // === 遊戲初始化 ===
        function init() {
            initThreeJS();
            createEnvironment();
            createPlayerCar();
            
            // 綁定按鈕與鍵盤事件
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);

            // 綁定手機虛擬按鈕事件
            setupMobileControls();

            // 開始渲染迴圈 (此時遊戲未開始，只渲染靜態畫面)
            requestAnimationFrame(gameLoop);
        }

        // === 設定手機觸控按鈕 ===
        function setupMobileControls() {
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');
            const btnFly = document.getElementById('btn-fly');

            // 封裝支援觸控與滑鼠點擊的事件
            const bindBtn = (el, onDown, onUp) => {
                el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); }, { passive: false });
                el.addEventListener('mousedown', (e) => { e.preventDefault(); onDown(); });
                if (onUp) {
                    el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); }, { passive: false });
                    el.addEventListener('mouseup', (e) => { e.preventDefault(); onUp(); });
                    el.addEventListener('mouseleave', (e) => { e.preventDefault(); onUp(); });
                }
            };

            bindBtn(btnLeft, () => {
                if (!gameActive) return;
                if (currentLane > 0) { currentLane--; targetX = LANES[currentLane]; }
            });

            bindBtn(btnRight, () => {
                if (!gameActive) return;
                if (currentLane < LANES.length - 1) { currentLane++; targetX = LANES[currentLane]; }
            });

            bindBtn(btnFly, 
                () => { // 按下起飛
                    if (!gameActive) return;
                    isFlying = true;
                    if (audioInitialized && flySynth) flySynth.triggerAttack();
                },
                () => { // 放開降落
                    if (!gameActive) return;
                    isFlying = false;
                    if (audioInitialized && flySynth) flySynth.triggerRelease();
                }
            );
        }

        async function startGame() {
            if (!audioInitialized) {
                await Tone.start();
                initAudio();
                audioInitialized = true;
            }

            // 重置狀態
            score = 0;
            batteryLevel = maxBattery;
            currentLane = 1;
            targetX = LANES[currentLane];
            playerCar.position.set(targetX, groundLevel, 0);
            playerCar.rotation.y = 0;
            isFlying = false;
            isSpinning = false;
            invincibleTime = 0;
            
            // 清理場景物件
            obstacles.forEach(obs => scene.remove(obs));
            obstacles.length = 0;
            items.forEach(item => scene.remove(item));
            items.length = 0;

            updateUI();
            startScreen.classList.add('hidden');
            uiLayer.classList.remove('hidden');
            
            Tone.Transport.start();
            gameActive = true;
        }

        // === 音效初始化 (動感節奏) ===
        function initAudio() {
            // 背景音樂：降低音量，並換成柔和的三角波(triangle)
            Tone.Transport.bpm.value = 135;
            bgm = new Tone.Synth({
                oscillator: { type: 'triangle' },
                envelope: { attack: 0.1, decay: 0.3, sustain: 0.2, release: 1.2 }
            }).toDestination();
            bgm.volume.value = -25; // 音量從 -12 調降至 -25，變得更小聲溫和

            const bassline = ["C2", "C2", "D#2", "F2", "C2", "C2", "G2", "F2"];
            let bassIdx = 0;
            Tone.Transport.scheduleRepeat(time => {
                if(gameActive) {
                    bgm.triggerAttackRelease(bassline[bassIdx], "8n", time);
                    bassIdx = (bassIdx + 1) % bassline.length;
                }
            }, "8n");

            // 飛行噪音
            flySynth = new Tone.NoiseSynth({
                noise: { type: 'pink' },
                envelope: { attack: 0.5, decay: 0.1, sustain: 0.2, release: 0.5 }
            }).toDestination();
            flySynth.volume.value = -15;

            // 獲得金幣音效
            coinSynth = new Tone.PolySynth(Tone.Synth).toDestination();
            coinSynth.volume.value = -8;

            // 獲得電池音效
            batterySynth = new Tone.Synth({
                oscillator: { type: 'sine' },
                envelope: { attack: 0.1, decay: 0.2, sustain: 0.5, release: 1 }
            }).toDestination();
            batterySynth.volume.value = -5;

            // 撞車音效
            crashSynth = new Tone.MembraneSynth().toDestination();
            crashSynth.volume.value = 0;
        }

        // === Three.js 視覺建構 ===
        function initThreeJS() {
            const canvas = document.getElementById('game-canvas');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // 晴天藍色
            scene.fog = new THREE.Fog(0x87CEEB, 30, 100);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 8, 16);
            camera.lookAt(0, 0, -10);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);
        }

        function createEnvironment() {
            // 柏油路面
            const roadGeo = new THREE.PlaneGeometry(20, 200);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -50;
            road.receiveShadow = true;
            scene.add(road);

            // 車道分隔線 (3條線隔開4車道)
            for(let i=0; i<30; i++) {
                const zPos = i * -10;
                [-3, 0, 3].forEach(x => {
                    const lineGeo = new THREE.PlaneGeometry(0.2, 4);
                    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const line = new THREE.Mesh(lineGeo, lineMat);
                    line.rotation.x = -Math.PI / 2;
                    line.position.set(x, 0.05, zPos);
                    scene.add(line);
                    roadLines.push(line);
                });
            }

            // 路邊綠樹
            for(let i=0; i<15; i++) {
                const zPos = i * -15;
                createTree(-11, zPos);
                createTree(11, zPos);
            }
        }

        function createTree(x, z) {
            const group = new THREE.Group();
            
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 2, 8), trunkMat);
            trunk.position.y = 1;
            trunk.castShadow = true;
            group.add(trunk);
            
            const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57 });
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(2, 5, 8), leavesMat);
            leaves.position.y = 4.5;
            leaves.castShadow = true;
            group.add(leaves);

            group.position.set(x, 0, z);
            scene.add(group);
            trees.push(group);
        }

        // 建立純白特仕版跑車 (根據您的圖片需求)
        function createPlayerCar() {
            playerCar = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.4 }); // 白車身
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 }); // 黑側裙/車窗

            // 底盤/黑色側裙
            const skirt = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.3, 4.4), darkMat);
            skirt.position.y = 0.35;
            playerCar.add(skirt);

            // 主要車身 (白色)
            const base = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.4, 4.2), bodyMat);
            base.position.set(0, 0.7, 0);
            base.castShadow = true;
            playerCar.add(base);

            // 車頭削尖
            const noseGeo = new THREE.BoxGeometry(2.0, 0.3, 1.2);
            noseGeo.translate(0, 0, -0.6); // 改變旋轉中心
            const nose = new THREE.Mesh(noseGeo, bodyMat);
            nose.position.set(0, 0.75, -2.1);
            nose.rotation.x = Math.PI / 12; // 向下傾斜
            playerCar.add(nose);

            // 黑色駕駛艙/車窗
            const cabinGeo = new THREE.BoxGeometry(1.6, 0.7, 2.2);
            const cabin = new THREE.Mesh(cabinGeo, darkMat);
            cabin.position.set(0, 1.1, -0.2);
            playerCar.add(cabin);

            // 大尾翼
            const spoiler = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.8), bodyMat);
            spoiler.position.set(0, 1.3, 2.0);
            spoiler.rotation.x = -Math.PI / 16;
            playerCar.add(spoiler);

            // 尾翼支架
            const supL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.3), darkMat);
            supL.position.set(-0.8, 1.1, 2.0);
            playerCar.add(supL);
            const supR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.3), darkMat);
            supR.position.set(0.8, 1.1, 2.0);
            playerCar.add(supR);

            // 輪胎與輪圈
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const rimMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8 }); // 黑色輪圈
            
            const wheelPositions = [ [-1.1, 0.4, 1.4], [1.1, 0.4, 1.4], [-1.1, 0.4, -1.2], [1.1, 0.4, -1.2] ];
            wheelPositions.forEach(pos => {
                const wheelGroup = new THREE.Group();
                
                const tireGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
                tireGeo.rotateZ(Math.PI / 2);
                const tire = new THREE.Mesh(tireGeo, wheelMat);
                
                const rimGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.32, 6); // 六角形輪圈
                rimGeo.rotateZ(Math.PI / 2);
                const rim = new THREE.Mesh(rimGeo, rimMat);
                
                wheelGroup.add(tire);
                wheelGroup.add(rim);
                wheelGroup.position.set(...pos);
                playerCar.add(wheelGroup);
            });

            // 推進器火焰 (預設隱藏)
            playerCar.thrusters = [];
            const thrustMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.8 });
            [[-0.6, 0.3, 2.4], [0.6, 0.3, 2.4]].forEach(pos => {
                const thrustGeo = new THREE.ConeGeometry(0.3, 1.5, 8);
                thrustGeo.rotateX(Math.PI / 2);
                const thrust = new THREE.Mesh(thrustGeo, thrustMat);
                thrust.position.set(...pos);
                thrust.visible = false;
                playerCar.add(thrust);
                playerCar.thrusters.push(thrust);
            });

            scene.add(playerCar);
            playerCar.position.set(targetX, groundLevel, 0);
        }

        // === 隨機生成物件 ===
        function spawnObject() {
            const lane = LANES[Math.floor(Math.random() * LANES.length)];
            const zPos = -100;
            const rand = Math.random();

            if (rand < 0.6) {
                // 產生障礙車輛
                const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffa500];
                const mat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });
                const obs = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, 4), mat);
                obs.position.set(lane, 0.6, zPos);
                obs.castShadow = true;
                scene.add(obs);
                obstacles.push(obs);
            } else if (rand < 0.9) {
                // 產生金幣
                const coinGroup = new THREE.Group();
                const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 1, roughness: 0.2 });
                const coinGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.2, 16);
                coinGeo.rotateX(Math.PI / 2);
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.position.y = 1;
                coinGroup.add(coin);
                coinGroup.position.set(lane, 0, zPos);
                coinGroup.type = 'coin';
                scene.add(coinGroup);
                items.push(coinGroup);
            } else {
                // 產生電池
                const batGroup = new THREE.Group();
                const batMat = new THREE.MeshStandardMaterial({ color: 0x10b981 });
                const batGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16);
                const bat = new THREE.Mesh(batGeo, batMat);
                bat.position.y = 1;
                batGroup.add(bat);
                batGroup.position.set(lane, 0, zPos);
                batGroup.type = 'battery';
                scene.add(batGroup);
                items.push(batGroup);
            }
        }

        // === 鍵盤控制 ===
        function onKeyDown(e) {
            if (!gameActive) return;
            if (e.code === 'ArrowLeft' && currentLane > 0) {
                currentLane--;
                targetX = LANES[currentLane];
            } else if (e.code === 'ArrowRight' && currentLane < LANES.length - 1) {
                currentLane++;
                targetX = LANES[currentLane];
            } else if (e.code === 'Space') {
                isFlying = true;
                if (audioInitialized && flySynth) flySynth.triggerAttack();
            }
        }

        function onKeyUp(e) {
            if (e.code === 'Space') {
                isFlying = false;
                if (audioInitialized && flySynth) flySynth.triggerRelease();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateUI() {
            scoreDisplay.innerText = score;
            batteryBar.style.width = `${Math.max(0, batteryLevel)}%`;
            
            if (playerCar.position.y > groundLevel + 0.5) {
                statusText.innerText = "Airborne";
                statusText.className = "text-sm font-bold text-blue-500 mt-1";
            } else {
                statusText.innerText = "Grounded";
                statusText.className = "text-sm font-bold text-gray-500 mt-1";
            }
        }

        // === 遊戲主迴圈 ===
        function gameLoop() {
            requestAnimationFrame(gameLoop);

            if (gameActive) {
                // 1. 玩家車輛移動與物理
                // 左右平滑切換
                playerCar.position.x += (targetX - playerCar.position.x) * 0.15;
                
                // 飛行與重力
                if (isFlying && batteryLevel > 0) {
                    velocityY += thrust;
                    batteryLevel -= 0.3; // 消耗電池
                    playerCar.thrusters.forEach(t => t.visible = true);
                } else {
                    velocityY += gravity;
                    playerCar.thrusters.forEach(t => t.visible = false);
                }
                
                playerCar.position.y += velocityY;
                
                // 地面碰撞與最高高度限制
                if (playerCar.position.y <= groundLevel) {
                    playerCar.position.y = groundLevel;
                    velocityY = 0;
                } else if (playerCar.position.y > 6) {
                    playerCar.position.y = 6;
                    velocityY = 0;
                }

                // 2. 撞車打轉與無敵閃爍邏輯
                if (isSpinning) {
                    spinAngle += 0.2;
                    playerCar.rotation.y = spinAngle;
                    if (spinAngle >= Math.PI * 4) { // 打轉兩圈 (720度)
                        isSpinning = false;
                        playerCar.rotation.y = 0;
                    }
                }

                if (invincibleTime > 0) {
                    invincibleTime--;
                    // 閃爍效果
                    playerCar.visible = (Math.floor(Date.now() / 100) % 2 === 0);
                } else {
                    playerCar.visible = true;
                }

                // 3. 環境移動
                roadLines.forEach(line => {
                    line.position.z += speed;
                    if (line.position.z > 10) line.position.z = -290;
                });

                trees.forEach(tree => {
                    tree.position.z += speed;
                    if (tree.position.z > 10) tree.position.z = -215;
                });

                // 4. 生成與更新障礙物/道具
                if (Math.random() < 0.02) spawnObject();

                // 更新障礙物 (車輛)
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z += speed * 0.6; // 障礙車也往前開(相對較慢)
                    
                    // 碰撞偵測 (未在無敵或打轉狀態下)
                    if (!isSpinning && invincibleTime <= 0) {
                        const distZ = Math.abs(obs.position.z - playerCar.position.z);
                        const distX = Math.abs(obs.position.x - playerCar.position.x);
                        const distY = Math.abs(obs.position.y - playerCar.position.y);
                        
                        if (distZ < 3.5 && distX < 1.5 && distY < 1.0) {
                            // 觸發撞車
                            if(audioInitialized && crashSynth) crashSynth.triggerAttackRelease("C2", "8n");
                            isSpinning = true;
                            spinAngle = 0;
                            invincibleTime = 120; // 約 2 秒無敵時間
                            if(audioInitialized && flySynth) flySynth.triggerRelease();
                            isFlying = false;
                        }
                    }

                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        score += 10; // 成功躲避加分
                    }
                }

                // 更新道具 (金幣/電池)
                for (let i = items.length - 1; i >= 0; i--) {
                    const item = items[i];
                    item.position.z += speed;
                    
                    // 旋轉動畫
                    item.children[0].rotation.y += 0.05;
                    if (item.type === 'coin') item.children[0].rotation.z += 0.05;

                    // 吃道具偵測
                    const distZ = Math.abs(item.position.z - playerCar.position.z);
                    const distX = Math.abs(item.position.x - playerCar.position.x);
                    const distY = Math.abs(item.position.y - playerCar.position.y);
                    
                    if (distZ < 2 && distX < 1.5 && distY < 1.5) {
                        if (item.type === 'coin') {
                            score += 50;
                            if(audioInitialized && coinSynth) coinSynth.triggerAttackRelease(["C5", "E5", "G5"], "16n");
                        } else if (item.type === 'battery') {
                            batteryLevel = Math.min(maxBattery, batteryLevel + 30);
                            if(audioInitialized && batterySynth) batterySynth.triggerAttackRelease("C4", "8n");
                        }
                        scene.remove(item);
                        items.splice(i, 1);
                        continue;
                    }

                    if (item.position.z > 10) {
                        scene.remove(item);
                        items.splice(i, 1);
                    }
                }

                // 逐漸增加難度
                speed = Math.min(1.5, speed + 0.0001);
                
                updateUI();
            }

            renderer.render(scene, camera);
        }

        // 啟動初始化
        window.onload = init;

    </script>
</body>
</html>
